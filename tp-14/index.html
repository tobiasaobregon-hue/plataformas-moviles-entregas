<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Contactos</h1>

        <div class="card">
            <div class="card-body">

                <h2>Contactos</h2>

                <!-- Buscador -->
                <input
                    type="text"
                    id="buscador"
                    class="form-control mb-3"
                    placeholder="Buscar por nombre, apellido o teléfono"
                >

                <!-- Opciones de orden -->
                <div class="mb-3">

                    <button
                        id="ordenar-nombre"
                        class="btn btn-secondary">
                        Ordenar por Nombre
                    </button>

                    <button
                        id="ordenar-apellido"
                        class="btn btn-secondary">
                        Ordenar por Apellido
                    </button>

                    <button
                        id="mostrar-favoritos"
                        class="btn btn-warning">
                        Ver Favoritos
                    </button>

                    <button
                        id="mostrar-todos"
                        class="btn btn-primary">
                        Ver Todos
                    </button>

                    <button
                        id="eliminar-seleccionados"
                        class="btn btn-danger">
                        Eliminar Seleccionados
                    </button>

                </div>

                <ul id="lista-contactos" class="list-group"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input
                            type="text"
                            class="form-control"
                            name="nombre"
                            id="input-nombre"
                            placeholder="Nombre"
                            aria-label="Nombre"
                        >

                        <input
                            type="text"
                            class="form-control"
                            name="apellido"
                            id="input-apellido"
                            placeholder="Apellido"
                            aria-label="Apellido"
                        >

                        <input
                            type="text"
                            class="form-control"
                            name="telefono"
                            id="input-telefono"
                            placeholder="Teléfono"
                            aria-label="Teléfono"
                        >

                    </div>

                    <button
                        class="btn btn-primary"
                        type="submit">
                        Agregar Contacto
                    </button>

                </form>

            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous">
    </script>


    <script type="text/javascript">

        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '123456789',
                favorito: false
            }
        ];


        // Variable para saber si estamos mostrando solamente favoritos
        let soloFavoritos = false;


        /**
         * agregarContacto()
         * Agrega un nuevo contacto a la lista.
         */
        function agregarContacto(nombre, apellido, telefono) {

            if (
                nombre.trim() === "" ||
                apellido.trim() === "" ||
                telefono.trim() === ""
            ) {
                alert("Completá todos los campos.");
                return;
            }


            const nuevoContacto = {
                nombre: nombre.trim(),
                apellido: apellido.trim(),
                telefono: telefono.trim(),
                favorito: false
            };


            contactos.push(nuevoContacto);

            mostrarListado();
        }


        /**
         * mostrarListado()
         * Muestra todos los contactos en el DOM.
         */
        function mostrarListado() {

            const lista =
                document.querySelector("#lista-contactos");

            lista.innerHTML = "";


            const textoBusqueda =
                document.querySelector("#buscador").value.toLowerCase();


            contactos.forEach(function(contacto, indice) {

                // Filtrar favoritos
                if (soloFavoritos && !contacto.favorito) {
                    return;
                }


                // Filtrar por buscador
                const datosContacto =
                    (
                        contacto.nombre +
                        " " +
                        contacto.apellido +
                        " " +
                        contacto.telefono
                    ).toLowerCase();


                if (!datosContacto.includes(textoBusqueda)) {
                    return;
                }


                // Crear elemento
                const elemento =
                    document.createElement("li");

                elemento.classList.add(
                    "list-group-item",
                    "d-flex",
                    "justify-content-between",
                    "align-items-center"
                );


                // Checkbox
                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.classList.add(
                    "form-check-input",
                    "me-2",
                    "checkbox-contacto"
                );

                checkbox.dataset.indice = indice;


                // Información del contacto
                const informacion =
                    document.createElement("span");

                informacion.innerHTML =
                    "<strong>" +
                    contacto.apellido +
                    ", " +
                    contacto.nombre +
                    "</strong>" +
                    " - Tel: " +
                    contacto.telefono;


                // Botón favorito
                const botonFavorito =
                    document.createElement("button");

                botonFavorito.classList.add(
                    "btn",
                    "btn-sm",
                    "me-2"
                );


                if (contacto.favorito) {

                    botonFavorito.textContent =
                        "★ Favorito";

                    botonFavorito.classList.add(
                        "btn-warning"
                    );

                } else {

                    botonFavorito.textContent =
                        "☆ Favorito";

                    botonFavorito.classList.add(
                        "btn-outline-warning"
                    );
                }


                botonFavorito.addEventListener(
                    "click",
                    function() {

                        contacto.favorito =
                            !contacto.favorito;

                        mostrarListado();
                    }
                );


                // Botón editar
                const botonEditar =
                    document.createElement("button");

                botonEditar.textContent =
                    "Editar";

                botonEditar.classList.add(
                    "btn",
                    "btn-warning",
                    "btn-sm",
                    "me-2"
                );


                botonEditar.addEventListener(
                    "click",
                    function() {

                        const nuevoNombre =
                            prompt(
                                "Nuevo nombre:",
                                contacto.nombre
                            );

                        if (nuevoNombre === null) {
                            return;
                        }


                        const nuevoApellido =
                            prompt(
                                "Nuevo apellido:",
                                contacto.apellido
                            );

                        if (nuevoApellido === null) {
                            return;
                        }


                        const nuevoTelefono =
                            prompt(
                                "Nuevo teléfono:",
                                contacto.telefono
                            );

                        if (nuevoTelefono === null) {
                            return;
                        }


                        if (
                            nuevoNombre.trim() !== "" &&
                            nuevoApellido.trim() !== "" &&
                            nuevoTelefono.trim() !== ""
                        ) {

                            contacto.nombre =
                                nuevoNombre.trim();

                            contacto.apellido =
                                nuevoApellido.trim();

                            contacto.telefono =
                                nuevoTelefono.trim();

                            mostrarListado();
                        }

                    }
                );


                // Botón eliminar
                const botonEliminar =
                    document.createElement("button");

                botonEliminar.textContent =
                    "Eliminar";

                botonEliminar.classList.add(
                    "btn",
                    "btn-danger",
                    "btn-sm"
                );


                botonEliminar.addEventListener(
                    "click",
                    function() {

                        contactos.splice(indice, 1);

                        mostrarListado();
                    }
                );


                // Contenedor de botones
                const botones =
                    document.createElement("div");

                botones.appendChild(botonFavorito);
                botones.appendChild(botonEditar);
                botones.appendChild(botonEliminar);


                // Contenedor de información
                const izquierda =
                    document.createElement("div");

                izquierda.classList.add(
                    "d-flex",
                    "align-items-center"
                );

                izquierda.appendChild(checkbox);
                izquierda.appendChild(informacion);


                // Agregar elementos al li
                elemento.appendChild(izquierda);
                elemento.appendChild(botones);


                lista.appendChild(elemento);

            });

        }


        /**
         * Ordenar por nombre
         */
        function ordenarPorNombre() {

            contactos.sort(function(a, b) {

                return a.nombre.localeCompare(
                    b.nombre
                );

            });

            mostrarListado();
        }


        /**
         * Ordenar por apellido
         */
        function ordenarPorApellido() {

            contactos.sort(function(a, b) {

                return a.apellido.localeCompare(
                    b.apellido
                );

            });

            mostrarListado();
        }


        /**
         * Mostrar solamente favoritos
         */
        function mostrarFavoritos() {

            soloFavoritos = true;

            mostrarListado();
        }


        /**
         * Mostrar todos
         */
        function mostrarTodos() {

            soloFavoritos = false;

            mostrarListado();
        }


        /**
         * Eliminar contactos seleccionados
         */
        function eliminarSeleccionados() {

            const checkboxes =
                document.querySelectorAll(
                    ".checkbox-contacto:checked"
                );


            const indices = [];


            checkboxes.forEach(function(checkbox) {

                indices.push(
                    parseInt(checkbox.dataset.indice)
                );

            });


            // Eliminamos desde el último hacia el primero
            indices
                .sort(function(a, b) {
                    return b - a;
                })
                .forEach(function(indice) {

                    contactos.splice(indice, 1);

                });


            mostrarListado();
        }


        /**
         * Buscar contactos
         */
        document
            .querySelector("#buscador")
            .addEventListener(
                "input",
                function() {

                    mostrarListado();

                }
            );


        /**
         * Formulario
         */
        function handlerFormulario(e) {

            e.preventDefault();

            const inputNombre =
                e.target.querySelector(
                    "#input-nombre"
                );

            const inputApellido =
                e.target.querySelector(
                    "#input-apellido"
                );

            const inputTelefono =
                e.target.querySelector(
                    "#input-telefono"
                );


            const nombre =
                inputNombre.value;

            const apellido =
                inputApellido.value;

            const telefono =
                inputTelefono.value;


            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";


            agregarContacto(
                nombre,
                apellido,
                telefono
            );
        }


        // Eventos
        document
            .querySelector("form")
            .addEventListener(
                "submit",
                handlerFormulario
            );


        document
            .querySelector("#ordenar-nombre")
            .addEventListener(
                "click",
                ordenarPorNombre
            );


        document
            .querySelector("#ordenar-apellido")
            .addEventListener(
                "click",
                ordenarPorApellido
            );


        document
            .querySelector("#mostrar-favoritos")
            .addEventListener(
                "click",
                mostrarFavoritos
            );


        document
            .querySelector("#mostrar-todos")
            .addEventListener(
                "click",
                mostrarTodos
            );


        document
            .querySelector("#eliminar-seleccionados")
            .addEventListener(
                "click",
                eliminarSeleccionados
            );


        // Mostrar el contacto inicial
        mostrarListado();

    </script>

</body>
</html>
