<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">

                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input
                            type="text"
                            class="form-control"
                            aria-label="Nombre del Producto"
                            placeholder="Ej: Leche"
                        >

                        <button
                            class="btn btn-primary"
                            type="submit">
                            Agregar Producto
                        </button>

                    </div>

                </form>

                <div class="mt-3">

                    <button
                        id="btn-ordenar"
                        class="btn btn-secondary">
                        Ordenar A-Z
                    </button>

                    <button
                        id="btn-limpiar"
                        class="btn btn-danger">
                        Limpiar Lista
                    </button>

                </div>

            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous">
    </script>


    <script type="text/javascript">

        // Obtener la lista del HTML
        const listaProductos = document.querySelector("#lista-productos");


        /**
         * agregarProducto()
         * Agrega un nuevo producto a la lista.
         */
        function agregarProducto(nombreProducto) {

            // Evitamos agregar productos vacíos
            if (nombreProducto.trim() === "") {
                return;
            }

            // Crear un nuevo elemento li
            const nuevoProducto = document.createElement("li");

            nuevoProducto.classList.add(
                "d-flex",
                "justify-content-between",
                "align-items-center",
                "mb-2"
            );

            // Crear el texto del producto
            const textoProducto = document.createElement("span");

            textoProducto.textContent = nombreProducto;

            // Marcar producto como comprado
            textoProducto.addEventListener("click", function() {

                if (textoProducto.style.textDecoration === "line-through") {
                    textoProducto.style.textDecoration = "none";
                } else {
                    textoProducto.style.textDecoration = "line-through";
                }

                guardarLista();

            });


            // Botón editar
            const botonEditar = document.createElement("button");

            botonEditar.textContent = "Editar";

            botonEditar.classList.add(
                "btn",
                "btn-warning",
                "btn-sm",
                "me-2"
            );


            botonEditar.addEventListener("click", function() {

                const nuevoNombre = prompt(
                    "Ingrese el nuevo nombre:",
                    textoProducto.textContent
                );

                if (
                    nuevoNombre !== null &&
                    nuevoNombre.trim() !== ""
                ) {

                    textoProducto.textContent =
                        nuevoNombre.trim();

                    guardarLista();
                }

            });


            // Botón eliminar
            const botonEliminar = document.createElement("button");

            botonEliminar.textContent = "Eliminar";

            botonEliminar.classList.add(
                "btn",
                "btn-danger",
                "btn-sm"
            );


            botonEliminar.addEventListener("click", function() {

                nuevoProducto.remove();

                guardarLista();

            });


            // Contenedor de botones
            const botones = document.createElement("div");

            botones.appendChild(botonEditar);
            botones.appendChild(botonEliminar);


            // Agregar elementos al li
            nuevoProducto.appendChild(textoProducto);
            nuevoProducto.appendChild(botones);


            // Agregar el producto a la lista
            listaProductos.appendChild(nuevoProducto);


            // Guardar en localStorage
            guardarLista();
        }


        /**
         * Handler del formulario
         */
        function handlerFormulario(evento) {

            evento.preventDefault();

            const input = evento.target.querySelector("input");

            const nombreProducto = input.value;

            input.value = "";

            agregarProducto(nombreProducto);
        }


        /**
         * Limpiar toda la lista
         */
        function limpiarLista() {

            listaProductos.innerHTML = "";

            guardarLista();
        }


        /**
         * Ordenar productos alfabéticamente
         */
        function ordenarProductos() {

            const productos =
                Array.from(listaProductos.children);

            productos.sort(function(a, b) {

                const nombreA =
                    a.querySelector("span").textContent.toLowerCase();

                const nombreB =
                    b.querySelector("span").textContent.toLowerCase();

                return nombreA.localeCompare(nombreB);
            });


            productos.forEach(function(producto) {

                listaProductos.appendChild(producto);

            });

            guardarLista();
        }


        /**
         * Guardar la lista en localStorage
         */
        function guardarLista() {

            const productos = [];

            listaProductos.querySelectorAll("li").forEach(
                function(producto) {

                    const texto =
                        producto.querySelector("span");

                    productos.push({
                        nombre: texto.textContent,
                        comprado:
                            texto.style.textDecoration === "line-through"
                    });

                }
            );

            localStorage.setItem(
                "listaCompras",
                JSON.stringify(productos)
            );
        }


        /**
         * Cargar la lista desde localStorage
         */
        function cargarLista() {

            const datos =
                localStorage.getItem("listaCompras");

            if (datos === null) {
                return;
            }


            const productos = JSON.parse(datos);

            listaProductos.innerHTML = "";


            productos.forEach(function(producto) {

                agregarProducto(producto.nombre);

                const ultimoProducto =
                    listaProductos.lastElementChild;

                const texto =
                    ultimoProducto.querySelector("span");


                if (producto.comprado) {

                    texto.style.textDecoration =
                        "line-through";
                }

            });

        }


        // Evento del formulario
        document
            .querySelector("#form-producto")
            .addEventListener(
                "submit",
                handlerFormulario
            );


        // Botón ordenar
        document
            .querySelector("#btn-ordenar")
            .addEventListener(
                "click",
                ordenarProductos
            );


        // Botón limpiar
        document
            .querySelector("#btn-limpiar")
            .addEventListener(
                "click",
                limpiarLista
            );


        // Cargar productos guardados
        cargarLista();

    </script>

</body>
</html>
