<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Tablero de Puntos</h1>

        <div class="card">

            <div class="card-body">

                <!-- TABLERO -->
                <div class="row text-center">

                    <div class="col-5">

                        <span
                            id="puntaje-local"
                            class="display-1">
                            0
                        </span>

                        <p
                            id="nombre-local"
                            class="m-0">
                            Local
                        </p>

                    </div>


                    <div class="col-2">

                        <span class="display-1">
                            :
                        </span>

                    </div>


                    <div class="col-5">

                        <span
                            id="puntaje-visitante"
                            class="display-1">
                            0
                        </span>

                        <p
                            id="nombre-visitante"
                            class="m-0">
                            Visitante
                        </p>

                    </div>

                </div>


                <hr class="hr">


                <!-- ACTUALIZAR CONTADOR -->
                <h2>Actualizar Contador</h2>

                <div class="row">

                    <div class="col-6 col-md-3 my-1">

                        <button
                            id="sumar-local"
                            class="btn d-block w-100 btn-success">
                            Local +
                        </button>

                    </div>


                    <div class="col-6 col-md-3 my-1">

                        <button
                            id="restar-local"
                            class="btn d-block w-100 btn-danger">
                            Local -
                        </button>

                    </div>


                    <div class="col-6 col-md-3 my-1">

                        <button
                            id="sumar-visitante"
                            class="btn d-block w-100 btn-success">
                            Visitante +
                        </button>

                    </div>


                    <div class="col-6 col-md-3 my-1">

                        <button
                            id="restar-visitante"
                            class="btn d-block w-100 btn-danger">
                            Visitante -
                        </button>

                    </div>

                </div>


                <hr>


                <!-- OTRAS ACCIONES -->

                <h2>Acciones</h2>

                <div class="row">

                    <div class="col-12 col-md-4 my-1">

                        <button
                            id="invertir"
                            class="btn btn-warning d-block w-100">
                            Invertir Puntaje
                        </button>

                    </div>


                    <div class="col-12 col-md-4 my-1">

                        <button
                            id="finalizar"
                            class="btn btn-dark d-block w-100">
                            Finalizar Partido
                        </button>

                    </div>


                    <div class="col-12 col-md-4 my-1">

                        <button
                            id="reiniciar"
                            class="btn btn-primary d-block w-100">
                            Reinicio
                        </button>

                    </div>

                </div>


                <hr>


                <!-- BONUS: NOMBRES -->

                <h2>Cambiar nombres</h2>

                <div class="row">

                    <div class="col-md-6 my-1">

                        <input
                            id="input-local"
                            type="text"
                            class="form-control"
                            placeholder="Nombre del equipo local">

                    </div>


                    <div class="col-md-6 my-1">

                        <input
                            id="input-visitante"
                            type="text"
                            class="form-control"
                            placeholder="Nombre del equipo visitante">

                    </div>

                </div>


                <button
                    id="cambiar-nombres"
                    class="btn btn-secondary mt-2">
                    Cambiar nombres
                </button>


                <hr>


                <!-- BONUS: COLORES -->

                <h2>Personalizar colores</h2>

                <div class="row">

                    <div class="col-md-6 my-1">

                        <label for="color-local">
                            Color Local
                        </label>

                        <input
                            id="color-local"
                            type="color"
                            class="form-control form-control-color"
                            value="#0d6efd">

                    </div>


                    <div class="col-md-6 my-1">

                        <label for="color-visitante">
                            Color Visitante
                        </label>

                        <input
                            id="color-visitante"
                            type="color"
                            class="form-control form-control-color"
                            value="#dc3545">

                    </div>

                </div>


                <hr>


                <!-- ESTADO -->

                <h2 id="estado">
                    Partido en juego
                </h2>

                <p>
                    Atajos de teclado:
                    <br>
                    <strong>A</strong> = Local +
                    <br>
                    <strong>Z</strong> = Local -
                    <br>
                    <strong>K</strong> = Visitante +
                    <br>
                    <strong>M</strong> = Visitante -
                </p>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous">
    </script>


    <script>

        // Puntos iniciales
        let puntosLocal = 0;
        let puntosVisitante = 0;

        // Estado del partido
        let partidoFinalizado = false;


        // Elementos del DOM
        const puntajeLocal =
            document.querySelector("#puntaje-local");

        const puntajeVisitante =
            document.querySelector("#puntaje-visitante");

        const estado =
            document.querySelector("#estado");


        // Botones
        const sumarLocal =
            document.querySelector("#sumar-local");

        const restarLocal =
            document.querySelector("#restar-local");

        const sumarVisitante =
            document.querySelector("#sumar-visitante");

        const restarVisitante =
            document.querySelector("#restar-visitante");


        /**
         * Actualizar tablero
         */
        function actualizarTablero() {

            puntajeLocal.textContent =
                puntosLocal;

            puntajeVisitante.textContent =
                puntosVisitante;

        }


        /**
         * Sumar punto al Local
         */
        function sumarPuntoLocal() {

            if (partidoFinalizado) {
                return;
            }

            puntosLocal++;

            actualizarTablero();
        }


        /**
         * Restar punto al Local
         */
        function restarPuntoLocal() {

            if (partidoFinalizado) {
                return;
            }

            if (puntosLocal > 0) {
                puntosLocal--;
            }

            actualizarTablero();
        }


        /**
         * Sumar punto al Visitante
         */
        function sumarPuntoVisitante() {

            if (partidoFinalizado) {
                return;
            }

            puntosVisitante++;

            actualizarTablero();
        }


        /**
         * Restar punto al Visitante
         */
        function restarPuntoVisitante() {

            if (partidoFinalizado) {
                return;
            }

            if (puntosVisitante > 0) {
                puntosVisitante--;
            }

            actualizarTablero();
        }


        /**
         * Invertir puntaje
         */
        function invertirPuntaje() {

            if (partidoFinalizado) {
                return;
            }

            let temporal = puntosLocal;

            puntosLocal =
                puntosVisitante;

            puntosVisitante =
                temporal;

            actualizarTablero();
        }


        /**
         * Finalizar partido
         */
        function finalizarPartido() {

            partidoFinalizado = true;

            estado.textContent =
                "Partido finalizado";

            estado.classList.add(
                "text-danger"
            );


            sumarLocal.disabled = true;
            restarLocal.disabled = true;
            sumarVisitante.disabled = true;
            restarVisitante.disabled = true;

        }


        /**
         * Reiniciar tablero
         */
        function reiniciarTablero() {

            puntosLocal = 0;

            puntosVisitante = 0;

            partidoFinalizado = false;

            actualizarTablero();

            estado.textContent =
                "Partido en juego";

            estado.classList.remove(
                "text-danger"
            );


            sumarLocal.disabled = false;
            restarLocal.disabled = false;
            sumarVisitante.disabled = false;
            restarVisitante.disabled = false;

        }


        /**
         * Cambiar nombres
         */
        function cambiarNombres() {

            const inputLocal =
                document.querySelector("#input-local");

            const inputVisitante =
                document.querySelector("#input-visitante");


            const nombreLocal =
                document.querySelector("#nombre-local");

            const nombreVisitante =
                document.querySelector("#nombre-visitante");


            if (inputLocal.value.trim() !== "") {

                nombreLocal.textContent =
                    inputLocal.value.trim();

            }


            if (inputVisitante.value.trim() !== "") {

                nombreVisitante.textContent =
                    inputVisitante.value.trim();

            }


            inputLocal.value = "";
            inputVisitante.value = "";

        }


        /**
         * Cambiar color del Local
         */
        function cambiarColorLocal() {

            const color =
                document.querySelector("#color-local").value;

            document.querySelector("#nombre-local").style.color =
                color;

            puntajeLocal.style.color =
                color;

        }


        /**
         * Cambiar color del Visitante
         */
        function cambiarColorVisitante() {

            const color =
                document.querySelector("#color-visitante").value;

            document.querySelector("#nombre-visitante").style.color =
                color;

            puntajeVisitante.style.color =
                color;

        }


        // Eventos de los botones

        sumarLocal.addEventListener(
            "click",
            sumarPuntoLocal
        );

        restarLocal.addEventListener(
            "click",
            restarPuntoLocal
        );

        sumarVisitante.addEventListener(
            "click",
            sumarPuntoVisitante
        );

        restarVisitante.addEventListener(
            "click",
            restarPuntoVisitante
        );


        document.querySelector("#invertir")
            .addEventListener(
                "click",
                invertirPuntaje
            );


        document.querySelector("#finalizar")
            .addEventListener(
                "click",
                finalizarPartido
            );


        document.querySelector("#reiniciar")
            .addEventListener(
                "click",
                reiniciarTablero
            );


        document.querySelector("#cambiar-nombres")
            .addEventListener(
                "click",
                cambiarNombres
            );


        document.querySelector("#color-local")
            .addEventListener(
                "input",
                cambiarColorLocal
            );


        document.querySelector("#color-visitante")
            .addEventListener(
                "input",
                cambiarColorVisitante
            );


        /**
         * Atajos de teclado
         */
        document.addEventListener(
            "keydown",
            function(evento) {

                // Si estamos escribiendo en un input,
                // no usamos los atajos
                if (
                    evento.target.tagName === "INPUT"
                ) {
                    return;
                }


                switch (
                    evento.key.toLowerCase()
                ) {

                    case "a":
                        sumarPuntoLocal();
                        break;

                    case "z":
                        restarPuntoLocal();
                        break;

                    case "k":
                        sumarPuntoVisitante();
                        break;

                    case "m":
                        restarPuntoVisitante();
                        break;

                }

            }
        );


        // Mostrar tablero inicialmente
        actualizarTablero();

    </script>

</body>
</html>
