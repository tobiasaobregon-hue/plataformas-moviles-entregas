<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Pokédex - TP 16</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="bg-danger text-white text-center py-4">
        <div class="container">
            <h1>Pokédex</h1>
            <p class="mb-0">
                Información sobre los primeros Pokémon
            </p>
        </div>
    </header>

    <main class="container my-4">

        <div class="text-center mb-4">
            <h2>Pokémon</h2>
            <p>
                Explorá los Pokémon y mirá información sobre cada uno.
            </p>
        </div>

        <!-- Spinner -->
        <div id="spinner" class="text-center my-5 d-none">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>

            <p class="mt-2">
                Cargando Pokémon...
            </p>
        </div>

        <!-- Mensaje de error -->
        <div id="mensaje-error" class="alert alert-danger d-none">
            No se pudieron cargar los Pokémon.
        </div>

        <!-- Grilla -->
        <div id="lista-pokemon" class="row g-4">
        </div>

        <!-- Botón cargar más -->
        <div class="text-center my-5">
            <button id="btn-cargar-mas" class="btn btn-danger btn-lg">
                Cargar más Pokémon
            </button>
        </div>

    </main>

    <!-- Modal -->
    <div class="modal fade" id="modalPokemon" tabindex="-1"
        aria-labelledby="modalPokemonLabel" aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header bg-danger text-white">

                    <h1 class="modal-title fs-4" id="modalPokemonLabel">
                        Información del Pokémon
                    </h1>

                    <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>

                <div class="modal-body">

                    <div id="modal-contenido">
                    </div>

                </div>

            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">
            TP-16 - Pokédex con PokeApi
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>

</html>
